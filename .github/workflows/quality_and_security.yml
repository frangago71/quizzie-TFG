name: CI - Quality & Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Backend lint check (Ruff)
        run: uvx ruff check .

      - name: Backend format check (Ruff)
        run: uvx ruff format . --check

      - name: Run security audit
        run: uvx pip-audit

  pytest-backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [backend-ci]
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run unit tests
        run: uv run pytest --cov=backend --cov-report=xml

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend lint check (ESLint)
        working-directory: ./frontend
        run: npm run lint

      - name: Type check & build
        working-directory: ./frontend
        run: npm run build

  vitest-component-tests:
    name: Component Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [frontend-ci]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Vitest component tests with coverage
        working-directory: ./frontend
        run: npm run test:frontend:coverage

      - name: Upload Vitest coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vitest-component-coverage
          path: frontend/coverage

  playwright-e2e-tests:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [pytest-backend-tests, frontend-ci]
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      PLAYWRIGHT_BASE_URL: "http://localhost:5173"
      PYTHONPATH: "backend:."
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv & Python 3.12
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Seed test database
        run: uv run python backend/seed.py

      - name: Start backend server for E2E tests
        run: |
          uv run uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          npx wait-on http://127.0.0.1:8000/docs --timeout 30000

      - name: Run Playwright E2E tests
        working-directory: ./frontend
        run: npm run test:e2e

      - name: Upload Playwright report artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/

  locust-performance-tests:
    name: Performance Tests (Locust)
    runs-on: ubuntu-latest
    needs: [pytest-backend-tests]
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      PYTHONPATH: "backend:."

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv & Python 3.12
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Seed test database
        run: uv run python backend/seed.py

      - name: Start backend server for performance tests
        run: |
          uv run uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          npx wait-on http://127.0.0.1:8000/docs --timeout 30000

      - name: Run Locust performance benchmark
        run: uv run python tests/performance/run_performance_tests.py -u 200 -r 15 -t 1m

      - name: Audit performance thresholds
        run: uv run python tests/performance/evaluate_thresholds.py

      - name: Upload performance CSV artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-locust-reports
          path: tests/performance/benchmark_results*.csv

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [vitest-component-tests, playwright-e2e-tests, locust-performance-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -f -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
